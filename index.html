    <main class="app-wrapper p-20">

        <!-- 
           Gateway redirect script. 
           Wipes old session state so users don't get stuck viewing yesterday's 
           scan results, then bounces them straight to the dashboard. 
        -->
        <script>
            // Flush stale session storage
            sessionStorage.removeItem('pendingImage');
            sessionStorage.removeItem('scanResults');

            // Instant redirect (replace prevents back-button loops)
            window.location.replace('dashboard.html');
        </script>

        <!-- version footer pinned to the bottom right across all pages -->
        <footer class="version-tag mt-auto">
            VERSION 2
        </footer>

    </main>
</body>
