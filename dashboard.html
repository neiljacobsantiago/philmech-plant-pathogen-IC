<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dashboard | PICS</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <main class="app-wrapper p-20">

        <!-- Header part. Branding shit. Wag galawin yung logo sizing. -->
        <header class="scan-header">
            <img src="assets/appLogo.png" alt="App Logo" style="width: 36px; height: 36px; object-fit: contain;">
            <div class="scan-header-right">
                <div class="scan-user-info">
                    <h2>WELCOME, USER!</h2>
                    <p>Plant Pathogen Image Classification System</p>
                </div>
                <img src="assets/userIcon.png" alt="User Avatar" class="profile-avatar-img">
            </div>
        </header>

        <!-- Empty state kapag wala pang na-scan na amag. Para may guide naman yung user kung anong gagawin. -->
        <section class="camera-placeholder">
            <div class="bracket bracket-tl"></div>
            <div class="bracket bracket-tr"></div>
            <div class="bracket bracket-bl"></div>
            <div class="bracket bracket-br"></div>
            
            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25">
                <circle cx="12" cy="12" r="8"></circle>
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="2" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="12" x2="22" y2="12"></line>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <h3 class="placeholder-title">Place a sample to perform this action</h3>
            <p class="placeholder-subtitle">Use buttons below to begin</p>
        </section>

        <!-- Mga buttons sa ilalim para hindi nakakangawit sa hinlalaki pag ginamit ng 1 hand -->
        <div class="bottom-controls mt-auto" style="width: 100%;">
            <div class="btn-stack">
                <button type="button" class="btn-action" id="dashCameraBtn">
                    <img src="assets/cameraIcon.svg" alt="Camera" style="width: 24px; height: 24px; margin-right: 4px;">
                    Use Camera
                </button>

                <button type="button" class="btn-action" id="dashUploadBtn">
                    <img src="assets/uploadIcon.svg" alt="Upload" style="width: 24px; height: 24px; margin-right: 4px;">
                    Upload File
                </button>
            </div>

            <!-- Nakatagong native file inputs. Dito binabato yung click events para hindi pangit tignan. -->
            <input type="file" id="dashFileInput" accept="image/*" style="display: none;">
            <input type="file" id="dashCameraInput" accept="image/*" capture="environment" style="display: none;">

            <footer class="version-tag">
                VERSION 0.1.4 | MODEL VERSION 1.0
            </footer>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
